<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanelForge - Global App Shell (Role-based)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            heading: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#F97316',
              'orange-hover': '#EA580C',
              'orange-light': '#FFF7ED',
              'orange-border': '#FDBA74'
            },
            paper: {
              white: '#FFFEFA',
              warm: '#F8F6F0',
              gray: '#F3F1EB',
              canvas: '#FFFFFF'
            },
            ink: {
              black: '#171717',
              gray: '#555555',
              light: '#B8B8B8',
              border: '#E7E7E7'
            },
            ai: {
              violet: '#8B5CF6',
              purple: '#6D28D9',
              light: '#F3E8FF'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E7E7E7; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #B8B8B8; }
  </style>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F8F6F0] font-sans antialiased text-[#171717] selection:bg-[#FFF7ED] selection:text-[#F97316]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================
    // 1. DATA DRIVEN NAVIGATION CONFIGURATION
    // =========================================================================
    // Giải thích: Mỗi role có một bộ nav item riêng, chia thành các section.
    // Điều này giúp dễ dàng thay đổi menu mà không cần can thiệp vào UI component (JSX).
    const NAV_CONFIG = {
      ADMINISTRATOR: [
        {
          section: 'SYSTEM ADMIN',
          items: [
            { icon: 'layout-dashboard', label: 'System Dashboard', href: '#admin-dash' },
            { icon: 'users', label: 'Users & Workspaces', href: '#users' },
            { icon: 'shield', label: 'Roles & Permissions', href: '#roles' },
            { icon: 'cpu', label: 'AI Provider & Quota', href: '#ai-quota', badge: { type: 'dot', color: 'bg-emerald-500' } },
            { icon: 'database', label: 'Storage & Backup', href: '#storage' },
            { icon: 'list', label: 'Global Audit Log', href: '#audit' },
            { icon: 'settings', label: 'Master Data', href: '#master-data' },
          ]
        }
      ],
      PRODUCER: [
        {
          section: 'WORKSPACE',
          items: [
            { icon: 'layout-dashboard', label: 'Dashboard', href: '#dashboard' },
            { icon: 'kanban', label: 'Production Pipeline', href: '#pipeline', isActive: true, badge: { type: 'text', text: 'Ch. 5', color: 'bg-[#F97316]/10 text-[#F97316]' } },
            { icon: 'book-marked', label: 'Series Bible', href: '#bible', badge: { type: 'dot', color: 'bg-[#8B5CF6]' } },
            { icon: 'users', label: 'Members & Roles', href: '#members', badge: { type: 'text', text: '6', color: 'text-[#555555]' } },
            { icon: 'calendar', label: 'Release Calendar', href: '#calendar' },
            { icon: 'history', label: 'Provenance / Restore', href: '#provenance' },
          ]
        },
        {
          section: 'PUBLISHING',
          items: [
            { icon: 'file-text', label: 'B5 Pre-Press Specs', href: '#specs' },
            { icon: 'shield-check', label: 'SHA-256 Provenance', href: '#sha' },
            { icon: 'upload', label: 'Export / Publish', href: '#export' },
          ]
        }
      ],
      WRITER: [
        {
          section: 'WRITING',
          items: [
            { icon: 'file-edit', label: 'My Scripts', href: '#scripts', isActive: true },
            { icon: 'sparkles', label: 'AI Breakdown Requests', href: '#ai-breakdown', badge: { type: 'text', text: '2 Pending', color: 'bg-[#F3E8FF] text-[#6D28D9]' } },
            { icon: 'book-marked', label: 'Series Bible (Link Mode)', href: '#bible' },
            { icon: 'split', label: 'Script Version Compare', href: '#compare' },
          ]
        }
      ],
      ARTIST: [
        {
          section: 'STUDIO DESK',
          items: [
            { icon: 'inbox', label: 'My Task Queue', href: '#queue', badge: { type: 'text', text: '12', color: 'bg-[#F97316] text-white rounded-full px-2' } },
            { icon: 'layout-template', label: 'Layout & Thumbnail', href: '#layout', isActive: true },
            { icon: 'upload-cloud', label: 'Upload Artwork', href: '#upload' },
            { icon: 'book-marked', label: 'Series Bible & Assets', href: '#assets' },
            { icon: 'alert-circle', label: 'Change Requests', href: '#requests', badge: { type: 'dot', color: 'bg-red-500' } },
          ]
        }
      ],
      LETTERER: [
        {
          section: 'LETTERING',
          items: [
            { icon: 'type', label: 'Panel Canvas', href: '#canvas', isActive: true },
            { icon: 'alert-triangle', label: 'Overflow Warnings', href: '#warnings', badge: { type: 'text', text: '3', color: 'bg-yellow-100 text-yellow-700' } },
            { icon: 'settings-2', label: 'Typography Presets', href: '#presets' },
          ]
        }
      ],
      EDITOR: [
        {
          section: 'EDITORIAL',
          items: [
            { icon: 'inbox', label: 'Review Queue', href: '#review-queue', isActive: true, badge: { type: 'text', text: 'In Review', color: 'bg-[#FFFBEB] text-[#D97706] border border-[#FDE68A]' } },
            { icon: 'columns', label: 'Side-by-side Compare', href: '#compare' },
            { icon: 'check-square', label: 'Consistency Check', href: '#check' },
            { icon: 'message-square', label: 'Change Requests', href: '#requests' },
          ]
        }
      ],
      READER: [] // Reader có UI rút gọn, không dùng Sidebar
    };

    // =========================================================================
    // 2. MAIN COMPONENT
    // =========================================================================
    function GlobalAppShell({ currentUser, activeSeries, children, aiState }) {
      
      // Re-initialize Lucide icons after every render (due to React rendering raw <i> tags)
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const isReader = currentUser.role === 'READER';
      const navSections = NAV_CONFIG[currentUser.role] || [];

      // Render badge dựa trên config
      const renderBadge = (badge) => {
        if (!badge) return null;
        if (badge.type === 'dot') {
          return <span className={`ml-auto w-1.5 h-1.5 rounded-full ${badge.color}`}></span>;
        }
        if (badge.type === 'text') {
          return <span className={`ml-auto inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium ${badge.color || 'text-[#555555]'}`}>{badge.text}</span>;
        }
        return null;
      };

      // AI State Configuration (hỗ trợ graceful degradation)
      const getAiBadgeConfig = (state) => {
        switch(state) {
          case 'degraded':
            return {
              wrapper: 'bg-yellow-50 text-yellow-700 border-yellow-200 hover:bg-yellow-100',
              icon: 'sparkles',
              iconColor: 'text-yellow-600',
              text: 'AI Slow',
              ping: false
            };
          case 'unavailable':
            return {
              wrapper: 'bg-gray-100 text-gray-500 border-gray-200 hover:bg-gray-200',
              icon: 'alert-triangle',
              iconColor: 'text-gray-500',
              text: 'AI Offline — Manual mode',
              ping: false
            };
          case 'active':
          default:
            return {
              wrapper: 'bg-[#F3E8FF] text-[#6D28D9] border-[#8B5CF6] hover:bg-[#EDE9FE]',
              icon: 'sparkles',
              iconColor: 'text-[#8B5CF6]',
              text: 'AI Active',
              ping: true,
              extra: <span className="text-[10px] font-mono text-[#8B5CF6]/80 border-l border-[#8B5CF6]/30 pl-1 ml-0.5">99.4%</span>
            };
        }
      };
      
      const aiConfig = getAiBadgeConfig(aiState);

      return (
        <div className="h-screen w-full flex overflow-hidden text-[#171717]">
          
          {/* --- SIDEBAR (Ẩn nếu là READER) --- */}
          {!isReader && (
            <aside className="w-64 bg-[#F8F6F0] border-r border-[#E7E7E7] flex flex-col shrink-0 select-none z-20 h-full">
              
              {/* Studio Brand Bar & Monogram */}
              <div className="px-5 pt-4 pb-1 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-[#171717] flex items-center justify-center text-white font-heading font-bold text-base shadow-sm tracking-tighter">
                    PF
                  </div>
                  <div>
                    <div className="font-heading font-bold text-sm leading-tight text-[#171717] tracking-tight">PanelForge</div>
                    <div className="text-[10px] uppercase font-mono tracking-wider text-[#555555] font-medium">Studio Edition</div>
                  </div>
                </div>
                <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-[#E7E7E7] text-[#555555]">v2.4</span>
              </div>

              {/* Top Section (Project Switcher or Admin Info) */}
              <div className="mx-4 mt-3">
                {currentUser.role === 'ADMINISTRATOR' ? (
                  <div className="bg-[#FFFFFF] border border-[#E7E7E7] rounded-lg p-2.5 flex items-center justify-between shadow-xs">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-6 h-6 rounded bg-[#171717] flex items-center justify-center shrink-0 text-white">
                        <i data-lucide="server" className="w-3.5 h-3.5"></i>
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-semibold text-[#171717] truncate leading-tight">System Global</p>
                        <p className="text-[10px] text-[#555555] font-mono truncate">Admin Zone</p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="group bg-[#FFFFFF] border border-[#E7E7E7] hover:border-[#B8B8B8] transition-all rounded-lg p-2.5 flex items-center justify-between cursor-pointer shadow-xs" title="Switch active manga serialization">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-6 h-6 rounded bg-[#FFF7ED] border border-[#FDBA74]/50 flex items-center justify-center shrink-0 text-[#F97316]">
                        <i data-lucide="book-open" className="w-3.5 h-3.5 stroke-[2.2]"></i>
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-semibold text-[#171717] truncate leading-tight">{activeSeries.title}</p>
                        <p className="text-[10px] text-[#555555] font-mono truncate">{activeSeries.subtitle}</p>
                      </div>
                    </div>
                    <i data-lucide="chevron-down" className="w-4 h-4 text-[#555555] group-hover:text-[#171717] transition-colors shrink-0 stroke-[2]"></i>
                  </div>
                )}
              </div>

              {/* Navigation Menu (Dynamic by Role) */}
              <nav className="mt-5 flex-1 overflow-y-auto px-2 space-y-4">
                {navSections.map((section, idx) => (
                  <div key={idx}>
                    <div className="text-[11px] text-[#555555] font-semibold px-3 mb-2 uppercase tracking-wider font-mono">
                      {section.section}
                    </div>
                    <div className="space-y-1">
                      {section.items.map((item, i) => {
                        // Apply active styling dynamically
                        const baseClass = "group flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors ";
                        const activeClass = item.isActive 
                          ? "bg-[#FFF7ED] text-[#F97316] border-l-4 border-[#F97316] shadow-2xs rounded-r-md rounded-l-none" 
                          : "text-[#555555] hover:bg-[#E7E7E7]/50 hover:text-[#171717]";
                        
                        const iconClass = `w-4 h-4 stroke-[2] transition-colors ${item.isActive ? 'text-[#F97316] stroke-[2.2]' : 'text-[#555555] group-hover:text-[#171717]'}`;

                        return (
                          <a key={i} href={item.href} className={baseClass + activeClass} aria-current={item.isActive ? 'page' : undefined}>
                            <i data-lucide={item.icon} className={iconClass}></i>
                            <span>{item.label}</span>
                            {renderBadge(item.badge)}
                          </a>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </nav>

              {/* Bottom Shared Utilities (Notifications, Search, History, Settings) */}
              <div className="mt-auto p-4 border-t border-[#E7E7E7] bg-[#FAF8F3]/60">
                <div className="space-y-1 mb-4">
                  <button className="w-full text-left flex items-center gap-2 text-sm text-[#555555] hover:text-[#171717] hover:bg-[#E7E7E7]/40 px-2 py-1.5 rounded-md transition-colors group">
                    <i data-lucide="bell" className="w-4 h-4 text-[#555555] group-hover:text-[#171717] stroke-[2]"></i>
                    <span className="font-medium text-xs">Notifications</span>
                  </button>
                  <button className="w-full text-left flex items-center gap-2 text-sm text-[#555555] hover:text-[#171717] hover:bg-[#E7E7E7]/40 px-2 py-1.5 rounded-md transition-colors group">
                    <i data-lucide="search" className="w-4 h-4 text-[#555555] group-hover:text-[#171717] stroke-[2]"></i>
                    <span className="font-medium text-xs">Global Search</span>
                  </button>
                  <button className="w-full text-left flex items-center gap-2 text-sm text-[#555555] hover:text-[#171717] hover:bg-[#E7E7E7]/40 px-2 py-1.5 rounded-md transition-colors group">
                    <i data-lucide="history" className="w-4 h-4 text-[#555555] group-hover:text-[#171717] stroke-[2]"></i>
                    <span className="font-medium text-xs">My Activity / History</span>
                  </button>
                  <button className="w-full text-left flex items-center gap-2 text-sm text-[#555555] hover:text-[#171717] hover:bg-[#E7E7E7]/40 px-2 py-1.5 rounded-md transition-colors group">
                    <i data-lucide="user-circle" className="w-4 h-4 text-[#555555] group-hover:text-[#171717] stroke-[2]"></i>
                    <span className="font-medium text-xs">Profile & Settings</span>
                  </button>
                </div>

                <div className="px-2 flex items-center justify-between text-[11px] text-[#555555] font-mono">
                  <span className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                    Sync Online
                  </span>
                  <span className="text-[#B8B8B8]">v2.4</span>
                </div>
              </div>
            </aside>
          )}

          {/* --- RIGHT WRAPPER (Header + Main Content) --- */}
          <div className="flex-1 flex flex-col min-w-0 h-full bg-[#FFFFFF]">

            {/* HEADER */}
            <header className="h-16 bg-[#FFFFFF] border-b border-[#E7E7E7] flex items-center justify-between px-6 shrink-0 z-10">
              
              {/* Left (Breadcrumb or Reader Title) */}
              <div className="flex items-center gap-2 min-w-0">
                {isReader ? (
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-[#171717] flex items-center justify-center text-white font-heading font-bold text-base shadow-sm tracking-tighter">PF</div>
                    <div>
                      <span className="text-[#171717] font-semibold text-sm">Preview: Cyberpunk 2077 - Chapter 5</span>
                      <span className="ml-2 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-red-50 text-red-600 border border-red-200">CONFIDENTIAL</span>
                    </div>
                  </div>
                ) : (
                  <nav className="flex items-center text-sm font-medium text-[#555555] truncate">
                    <span className="hover:text-[#171717] cursor-pointer transition-colors">Projects</span>
                    <span className="mx-2 text-[#B8B8B8] font-normal select-none">/</span>
                    <span className="hover:text-[#171717] cursor-pointer transition-colors truncate">{activeSeries.title}</span>
                    <span className="mx-2 text-[#B8B8B8] font-normal select-none">/</span>
                    <span className="text-[#171717] font-semibold truncate flex items-center gap-1.5">
                      {currentUser.role === 'ADMINISTRATOR' ? 'Global Settings' : 'Chapter 5 Pipeline'}
                      {!['ADMINISTRATOR', 'READER'].includes(currentUser.role) && (
                        <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-[#FFFBEB] text-[#D97706] border border-[#FDE68A]">In Review</span>
                      )}
                    </span>
                  </nav>
                )}
              </div>

              {/* Right (Utilities) */}
              <div className="flex items-center gap-4 shrink-0">
                
                {/* Search - Ẩn ở chế độ Reader */}
                {!isReader && (
                  <div className="relative flex items-center">
                    <i data-lucide="search" className="w-3.5 h-3.5 text-[#555555] absolute left-3 pointer-events-none stroke-[2]"></i>
                    <input 
                      type="text" 
                      placeholder="Search cuts, dialogue, lore..." 
                      className="bg-[#F3F3F3] border border-[#E7E7E7] rounded-full pl-8 pr-8 py-1.5 text-xs text-[#171717] placeholder:text-[#B8B8B8] focus:outline-none focus:border-[#F97316] focus:bg-[#FFFFFF] focus:ring-2 focus:ring-[#F97316]/10 transition-all w-56 lg:w-64"
                    />
                    <kbd className="hidden sm:inline-block absolute right-2.5 text-[9px] font-mono text-[#555555] bg-white border border-[#E7E7E7] rounded px-1.5 py-0.5 shadow-2xs pointer-events-none">⌘K</kbd>
                  </div>
                )}

                {/* AI Badge - Thay đổi trạng thái động */}
                {!isReader && (
                  <div className={`hidden sm:flex items-center gap-1.5 border px-2.5 py-1 rounded-full text-xs font-medium transition-all cursor-default shadow-2xs ${aiConfig.wrapper}`}>
                    {aiConfig.ping && <span className="w-1.5 h-1.5 rounded-full bg-[#8B5CF6] animate-ping"></span>}
                    <i data-lucide={aiConfig.icon} className={`w-3 h-3 stroke-[2.2] ${aiConfig.iconColor}`}></i>
                    <span>{aiConfig.text}</span>
                    {aiConfig.extra}
                  </div>
                )}

                {/* Reader CTA (Leave Feedback / Exit) */}
                {isReader && (
                  <button className="text-sm font-medium text-[#555555] hover:text-[#171717] px-3 py-1.5 flex items-center gap-1.5">
                    <i data-lucide="log-out" className="w-4 h-4"></i> Exit Preview
                  </button>
                )}

                {!isReader && (
                  <button className="p-1.5 text-[#555555] hover:text-[#171717] hover:bg-[#F3F3F3] rounded-full transition-colors relative" aria-label="Notifications">
                    <i data-lucide="bell" className="w-4 h-4 stroke-[2]"></i>
                    <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#F97316] ring-2 ring-white"></span>
                  </button>
                )}

                <div className="h-5 w-px bg-[#E7E7E7]"></div>

                {/* User Identity */}
                <div className="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity" title="User Profile">
                  <div className="w-8 h-8 rounded-full bg-[#171717] text-[#FFFFFF] font-heading font-semibold text-xs flex items-center justify-center shadow-xs ring-1 ring-[#E7E7E7]">
                    {currentUser.avatarInitials}
                  </div>
                  <div className="hidden md:flex flex-col text-left">
                    <span className="text-xs font-medium text-[#171717] leading-tight">{currentUser.name}</span>
                    <span className="text-[10px] text-[#555555] font-mono leading-none">{currentUser.role}</span>
                  </div>
                </div>

                {/* Export / Action CTA */}
                {['PRODUCER', 'ADMINISTRATOR', 'ARTIST'].includes(currentUser.role) && (
                  <button className="bg-[#F97316] text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-[#EA580C] active:scale-[0.98] transition-all flex items-center gap-1.5 shadow-sm">
                    <i data-lucide={currentUser.role === 'ARTIST' ? 'upload-cloud' : 'download'} className="w-3.5 h-3.5 stroke-[2.5]"></i>
                    <span>{currentUser.role === 'ARTIST' ? 'Submit' : 'Export'}</span>
                  </button>
                )}

                {isReader && (
                  <button className="bg-[#171717] text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-black transition-all shadow-sm">
                    Leave Feedback
                  </button>
                )}

              </div>
            </header>

            {/* MAIN CANVAS */}
            <main className="flex-1 bg-[#F3F3F3] overflow-y-auto p-6 flex flex-col min-h-0 relative">
              
              {/* Reader Watermark Overlay (Security Requirement) */}
              {isReader && (
                <div className="absolute inset-0 pointer-events-none flex flex-col items-center justify-center opacity-[0.03] rotate-[-30deg] z-0 overflow-hidden">
                  <p className="text-6xl font-heading font-bold text-black whitespace-nowrap">CONFIDENTIAL PREVIEW DO NOT DISTRIBUTE</p>
                  <p className="text-6xl font-heading font-bold text-black whitespace-nowrap mt-20">CONFIDENTIAL PREVIEW DO NOT DISTRIBUTE</p>
                  <p className="text-6xl font-heading font-bold text-black whitespace-nowrap mt-20">CONFIDENTIAL PREVIEW DO NOT DISTRIBUTE</p>
                </div>
              )}

              {/* Canvas Content Container */}
              <div className="w-full h-full min-h-[460px] border-2 border-dashed border-[#B8B8B8] rounded-xl flex flex-col items-center justify-center p-8 text-center bg-[#FFFFFF]/60 backdrop-blur-xs transition-colors hover:border-[#F97316]/60 hover:bg-[#FFFFFF]/90 relative z-10">
                
                <div className="w-16 h-16 rounded-2xl bg-[#FFF7ED] border border-[#FDBA74] flex items-center justify-center text-[#F97316] mb-4 shadow-sm">
                  <i data-lucide={isReader ? 'eye' : 'layers'} className="w-8 h-8 stroke-[1.8]"></i>
                </div>

                <h2 className="text-base md:text-lg font-heading font-semibold text-[#171717] mb-1.5">
                  Workspace Context: <span className="text-[#F97316]">{currentUser.role}</span>
                </h2>
                
                <p className="text-xs md:text-sm text-[#737373] max-w-lg mb-6 leading-relaxed">
                  Dynamic layout adapts automatically. {isReader ? "You are viewing a secure, read-only preview. Production tools are hidden." : "You have access to the internal production tools based on your role assignments."}
                </p>

                {children}

              </div>
            </main>

          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. DEMO APP WRAPPER (Role Switcher & State Management)
    // =========================================================================
    function App() {
      const [role, setRole] = useState('PRODUCER');
      const [aiState, setAiState] = useState('active'); // active, degraded, unavailable

      const ROLES = ['ADMINISTRATOR', 'PRODUCER', 'WRITER', 'ARTIST', 'LETTERER', 'EDITOR', 'READER'];
      
      const mockUser = {
        name: role === 'ADMINISTRATOR' ? 'System Admin' : 'Tatsuki F.',
        role: role,
        avatarInitials: role === 'ADMINISTRATOR' ? 'SA' : 'TF'
      };

      const mockSeries = {
        title: 'Cyberpunk 2077',
        subtitle: 'Vol. 01 / Arc 02'
      };

      return (
        <div className="relative h-full w-full">
          
          <GlobalAppShell 
            currentUser={mockUser} 
            activeSeries={mockSeries}
            aiState={aiState}
          >
            {/* Nội dung minh hoạ bên trong Canvas */}
            <div className="flex flex-wrap items-center justify-center gap-2 max-w-xl">
              <div className="flex items-center gap-1.5 px-3 py-1 bg-[#FFFFFF] border border-[#E7E7E7] rounded-md text-xs font-mono text-[#555555]">
                <i data-lucide="check-circle-2" className="w-3.5 h-3.5 text-emerald-600"></i>
                <span>Role: {role}</span>
              </div>
              <div className="flex items-center gap-1.5 px-3 py-1 bg-[#FFFFFF] border border-[#E7E7E7] rounded-md text-xs font-mono text-[#555555]">
                <i data-lucide="cpu" className="w-3.5 h-3.5 text-[#6D28D9]"></i>
                <span>AI State: {aiState}</span>
              </div>
            </div>
          </GlobalAppShell>

          {/* DEMO TOOLBAR (Chỉ dành cho xem trước, sẽ bị xóa ở production) */}
          <div className="fixed bottom-4 right-4 bg-white border border-[#E7E7E7] rounded-lg shadow-xl p-4 flex flex-col gap-3 z-50 w-72">
            <div className="text-xs font-bold text-[#171717] font-mono border-b pb-2">🛠 DEMO CONTROLS</div>
            
            <div>
              <label className="text-[10px] font-bold text-[#555555] uppercase mb-1 block">Switch Role</label>
              <select 
                className="w-full bg-[#F3F3F3] border border-[#E7E7E7] rounded p-1.5 text-xs focus:outline-none focus:border-[#F97316]"
                value={role}
                onChange={(e) => setRole(e.target.value)}
              >
                {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>

            <div>
              <label className="text-[10px] font-bold text-[#555555] uppercase mb-1 block">AI Degradation Demo</label>
              <select 
                className="w-full bg-[#F3F3F3] border border-[#E7E7E7] rounded p-1.5 text-xs focus:outline-none focus:border-[#F97316]"
                value={aiState}
                onChange={(e) => setAiState(e.target.value)}
              >
                <option value="active">Active (Normal)</option>
                <option value="degraded">Degraded (Slow)</option>
                <option value="unavailable">Unavailable (Offline)</option>
              </select>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
