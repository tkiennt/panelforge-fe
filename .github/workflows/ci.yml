name: Frontend CI

on:
  pull_request:
    branches: [ "main", "dev" ]
  push:
    branches: [ "main", "dev", "trungkien" ]

jobs:
  quality-assurance:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Checking (TypeScript)
        run: npm run typecheck

      - name: i18n Parity Check (vi/en)
        run: npm run i18n:check

      - name: Linting (ESLint)
        run: npm run lint

      - name: Automated Unit & Component Tests (Vitest)
        run: npm run test:run -- --reporter=default --reporter=github-actions

      - name: Production Bundle Verification (Vite Build)
        run: npm run build

      - name: Upload Build Artifacts (Production & Dev)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v4
        with:
          name: panelforge-fe-${{ github.ref_name }}
          path: dist/
          retention-days: 7

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Automated End-to-End Tests (Playwright)
        run: npm run test:e2e
        continue-on-error: true
